# Unity WebGL 클라이언트를 빌드해 GitHub Pages에 배포합니다.
# 서버 배포는 이후 별도 워크플로(예: deploy-server.yml)로 추가합니다.
name: Deploy Client (GitHub Pages)

on:
  push:
    branches: [main]
    # 클라이언트 빌드에 영향을 주는 파일만 감시합니다. Markdown 변경만 있으면 실행하지 않습니다.
    paths:
      - "Client/Assets/**"
      - "Client/Packages/**"
      - "Client/ProjectSettings/**"
      - "Shared/**"
      - ".github/workflows/deploy-client.yml"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 배포는 한 번에 하나만 진행하고, 진행 중인 배포는 취소하지 않습니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Unity WebGL 도커 이미지가 커서 기본 러너 디스크가 부족할 수 있습니다.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Client/Library
          key: Library-WebGL-${{ hashFiles('Client/Assets/**', 'Client/Packages/**', 'Client/ProjectSettings/**', 'Shared/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Client
          targetPlatform: WebGL
          buildName: MutatIO
          buildMethod: MutatIO.Editor.WebGLPagesBuild.BuildForPages

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/MutatIO

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
